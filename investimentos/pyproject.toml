[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gestao-investimentos"
version = "0.1.0"
description = "Gestao de carteira de investimentos com foco em acompanhamento de proventos"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlmodel>=0.0.22",
    "httpx>=0.27",
    "openpyxl>=3.1",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "playwright>=1.44"]

# Sem isso o setuptools acha `app`, `web` e `testes` na raiz e se recusa a
# adivinhar qual deles e o pacote a instalar.
[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["testes"]
