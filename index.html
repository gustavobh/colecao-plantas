<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Coleção de Plantas</title>
<meta name="description" content="Catálogo pessoal do jardim: identifica plantas por foto e geolocalização e guarda tudo no próprio celular.">
<meta name="theme-color" content="#1f3d2b" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f4f1e8" media="(prefers-color-scheme: light)">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icones/icone-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Jardim">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" href="./icones/icone.svg" type="image/svg+xml">
<link rel="stylesheet" href="./css/estilo.css">
</head>
<body>

<header class="topo" id="topo">
  <button class="topo-voltar" id="btn-voltar" hidden aria-label="Voltar">‹</button>
  <h1 class="topo-titulo" id="topo-titulo">Coleção</h1>
  <div class="topo-acoes" id="topo-acoes"></div>
</header>

<main id="app" class="conteudo" aria-live="polite"></main>

<!-- Ícones em SVG inline com currentColor: acompanham a cor da aba ativa e o
     modo escuro, coisa que emoji não faz. -->
<nav class="abas" id="abas">
  <a href="#/colecao" data-aba="colecao">
    <svg class="abas-icone" viewBox="0 0 24 24" aria-hidden="true">
      <path d="M12 3c5 2.6 6.4 7.6 4.6 11-1.3 2.4-3.3 3.4-4.6 3.8-1.3-.4-3.3-1.4-4.6-3.8C5.6 10.6 7 5.6 12 3Z"/>
      <path d="M12 4.5V21" class="traco"/>
    </svg>
    <span>Coleção</span>
  </a>
  <a href="#/nova" data-aba="nova" class="abas-destaque">
    <span class="abas-icone">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14" class="traco"/></svg>
    </span>
    <span>Registrar</span>
  </a>
  <a href="#/mapa" data-aba="mapa">
    <svg class="abas-icone" viewBox="0 0 24 24" aria-hidden="true">
      <path d="M9 4 3 6.5v14L9 18l6 2.5 6-2.5v-14L15 6.5 9 4Z" class="traco"/>
      <path d="M9 4v14M15 6.5v14" class="traco"/>
    </svg>
    <span>Terreno</span>
  </a>
  <a href="#/ajustes" data-aba="ajustes">
    <svg class="abas-icone" viewBox="0 0 24 24" aria-hidden="true">
      <path d="M4 7h10M18 7h2M4 12h4M12 12h8M4 17h10M18 17h2" class="traco"/>
      <circle cx="16" cy="7" r="2.1" class="traco"/>
      <circle cx="10" cy="12" r="2.1" class="traco"/>
      <circle cx="16" cy="17" r="2.1" class="traco"/>
    </svg>
    <span>Ajustes</span>
  </a>
</nav>

<div id="avisos" class="avisos" aria-live="assertive"></div>

<script type="module" src="./js/app.js"></script>
</body>
</html>
